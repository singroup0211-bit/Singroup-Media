<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 60" width="100%" height="100%">
  <!-- Retro Pixelated Red Star and Mouse Cursor Emblem -->
  <g transform="translate(10, 6) scale(1.15)">
    <!-- Red Pixel Sparkle / Star -->
    <rect x="18" y="2" width="2" height="4" fill="#E11D48" />
    <rect x="17" y="6" width="4" height="4" fill="#E11D48" />
    <rect x="16" y="10" width="6" height="4" fill="#E11D48" />
    <rect x="2" y="18" width="4" height="2" fill="#E11D48" />
    <rect x="6" y="17" width="4" height="4" fill="#E11D48" />
    <rect x="10" y="16" width="4" height="6" fill="#E11D48" />
    <rect x="14" y="14" width="12" height="12" fill="#EF4444" />
    <rect x="26" y="17" width="5" height="3" fill="#E11D48" />
    <rect x="31" y="18" width="4" height="2" fill="#E11D48" />
    <rect x="17" y="26" width="3" height="5" fill="#E11D48" />
    <rect x="18" y="31" width="2" height="4" fill="#E11D48" />

    <!-- Pixel Retro Mouse Cursor Arrow -->
    <polygon points="14,12 14,35 19,30 24,40 28,38 23,28 31,28" stroke="#090A0F" stroke-width="2.5" stroke-linejoin="miter" fill="#090A0F" />
    <polygon points="15,14 15,32 18.5,28.5 23,37.5 25.5,36.5 21.5,27.5 28,27.5" fill="#FFFDF8" />
  </g>

  <!-- Typography -->
  <g transform="translate(68, 8)">
    <text x="0" y="22" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="22" fill="#F8FAFC" letter-spacing="-0.02em">Sin Group</text>
    <text x="1" y="42" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-weight="500" font-size="16" fill="#EF4444" letter-spacing="0.08em">MEDYA</text>
    <text x="68" y="42" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="600" font-size="12" fill="#94A3B8" letter-spacing="0.02em">• ERP &amp; ACADEMY</text>
  </g>
</svg>
