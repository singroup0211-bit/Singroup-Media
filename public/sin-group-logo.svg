<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <rect width="500" height="500" rx="40" fill="#141416" />
  
  <!-- Subtle ambient glow behind emblem -->
  <circle cx="360" cy="210" r="90" fill="#EF4444" opacity="0.12" filter="blur(25px)" />
  
  <!-- Typography "Sin group Medya" -->
  <g transform="translate(65, 160)">
    <!-- "Sin" -->
    <text x="0" y="38" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="62" fill="#F8FAFC" letter-spacing="-0.03em">Sin</text>
    <!-- "group" -->
    <text x="0" y="98" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="62" fill="#F8FAFC" letter-spacing="-0.03em">group</text>
    <!-- "Medya" -->
    <text x="50" y="162" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-weight="500" font-size="52" fill="#F1F5F9" letter-spacing="-0.02em">Medya</text>
  </g>

  <!-- Retro Pixelated Red Star and Mouse Cursor Emblem -->
  <g transform="translate(290, 140) scale(2.8)">
    <!-- Red Pixel Sparkle / Star (Pixel grid 24x24) -->
    <!-- Top point -->
    <rect x="18" y="2" width="2" height="4" fill="#E11D48" />
    <rect x="17" y="6" width="4" height="4" fill="#E11D48" />
    <rect x="16" y="10" width="6" height="4" fill="#E11D48" />
    <!-- Left point -->
    <rect x="0" y="18" width="4" height="2" fill="#E11D48" />
    <rect x="4" y="17" width="4" height="4" fill="#E11D48" />
    <rect x="8" y="16" width="4" height="6" fill="#E11D48" />
    <!-- Center mass of star -->
    <rect x="12" y="12" width="14" height="14" fill="#EF4444" />
    <rect x="14" y="14" width="10" height="10" fill="#F43F5E" />
    <!-- Right point -->
    <rect x="26" y="17" width="5" height="3" fill="#E11D48" />
    <rect x="31" y="18" width="4" height="2" fill="#E11D48" />
    <!-- Bottom point -->
    <rect x="17" y="26" width="3" height="5" fill="#E11D48" />
    <rect x="18" y="31" width="2" height="4" fill="#E11D48" />

    <!-- Pixel Retro Mouse Cursor Arrow (Black border + White interior) -->
    <!-- Shadow / outline pixels -->
    <g fill="#090A0F">
      <!-- Cursor outline points -->
      <polygon points="14,12 14,35 19,30 24,40 28,38 23,28 31,28" stroke="#090A0F" stroke-width="2.5" stroke-linejoin="miter" />
    </g>
    <!-- Cursor white interior -->
    <polygon points="15,14 15,32 18.5,28.5 23,37.5 25.5,36.5 21.5,27.5 28,27.5" fill="#FFFDF8" />
  </g>

  <!-- Bottom-right tiny pixel star sparkle -->
  <g transform="translate(420, 420) scale(0.9)">
    <rect x="8" y="0" width="4" height="20" fill="#64748B" opacity="0.6" rx="2" />
    <rect x="0" y="8" width="20" height="4" fill="#64748B" opacity="0.6" rx="2" />
    <circle cx="10" cy="10" r="3" fill="#94A3B8" opacity="0.8" />
  </g>
</svg>
